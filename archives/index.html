<!DOCTYPE html>
<html lang="zh-CN">
<head lang="zh-CN">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🧠 智能标题判断：如果是文章页看 page.title；如果是专栏页看 page.category；都没有就显示默认博客名！ -->
    <title>Monologue</title>
    
    <!-- 🚀 Hexo 原生样式引入助手：自动连通我们刚才在 source/css/style.css 写的样式！ -->
    
<link rel="stylesheet" href="/css/style.css">

<meta name="generator" content="Hexo 8.1.2"></head>
<body>
    <header style="text-align: center; padding: 2rem 0; border-bottom: 1px solid #eee; margin-bottom: 2rem;">
    <!-- 点击博客名字，永远能回到首页 -->
    <!-- 你的全站导航菜单 -->
    <nav style="margin-top: 1rem;">
        <a href="/" style="text-decoration: none; color: #111;">
            <h1 style="margin: 0;">Monologue</h1>
        </a>
        <a href="https://github.com/yaojiwww" target="_blank" style="margin: 0 1rem; color: #666; text-decoration: none;">GitHub</a>
        <span>专栏</span>
        
        <!-- 🌙 日夜切换开关按钮 -->
        <button id="theme-toggle" style="margin-left: 1rem; padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s;">
            🌙 暗黑模式
        </button>
    </nav>
</header>    
        <main>

        <!-- 使用你最熟悉的 CSS Grid 网格布局，自动把专栏排成精美的卡片矩阵！ -->
        <div class="columns-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.8rem;">
            
                <div class="column-card" style="background: white; padding: 2rem 1.5rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; text-align: center; display: flex; flex-direction: column; justify-content: space-between;">
                    
                    <div>
                        <!-- 专栏名称 -->
                        <h3 style="margin-top: 0; color: #0f172a; font-size: 1.3rem;">STM32</h3>
                        
                        <!-- 专栏收录的文章数量 -->
                        <p style="color: #64748b; font-size: 0.9rem; margin: 1rem 0 2rem;">
                            📑 共收录 <strong>3</strong> 篇硬核知识点
                        </p>
                    </div>
                    
                    <!-- 点击进入专栏的按钮 -->
                    <div>
                        <a href="/categories/STM32/" style="display: inline-block; padding: 0.6rem 1.8rem; background: #3b82f6; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);">
                            进入专栏 →
                        </a>
                    </div>
                </div>
            
                <div class="column-card" style="background: white; padding: 2rem 1.5rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; text-align: center; display: flex; flex-direction: column; justify-content: space-between;">
                    
                    <div>
                        <!-- 专栏名称 -->
                        <h3 style="margin-top: 0; color: #0f172a; font-size: 1.3rem;">个人</h3>
                        
                        <!-- 专栏收录的文章数量 -->
                        <p style="color: #64748b; font-size: 0.9rem; margin: 1rem 0 2rem;">
                            📑 共收录 <strong>2</strong> 篇硬核知识点
                        </p>
                    </div>
                    
                    <!-- 点击进入专栏的按钮 -->
                    <div>
                        <a href="/categories/%E4%B8%AA%E4%BA%BA/" style="display: inline-block; padding: 0.6rem 1.8rem; background: #3b82f6; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);">
                            进入专栏 →
                        </a>
                    </div>
                </div>
            
        </div>
    </main>

</footer>
